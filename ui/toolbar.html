<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OniScreen</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { background: transparent; }
  body { padding: 8px; }
  .bar {
    display: inline-flex; align-items: center; gap: 2px; padding: 6px;
    background: var(--oni-bg-surface); border: 1px solid var(--oni-border-default);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .brand { width: 22px; height: 22px; margin: 0 6px 0 4px; flex: none; }
  .stack { width: max-content; flex-shrink: 0; display: inline-flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .bar { cursor: grab; }
  .bar.sub { padding: 4px 6px; gap: 2px; border-radius: 12px; }
  /* 리본 표시 상태는 접기 버튼만 변경한다. */
  .stack .sub { display: none; }
  .stack:not(.folded) .sub { display: flex; justify-content: space-between; }
  #pw { width: 84px; height: 20px; margin: 0 2px; accent-color: var(--oni-action-default); cursor: pointer; }
  .pwv { min-width: 34px; text-align: center; font: 500 12px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; font-variant-numeric: tabular-nums; color: var(--oni-text-secondary); }
  .lbl { font: 500 12px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--oni-text-muted); padding: 0 2px 0 4px; white-space: nowrap; }
  .btn.wide { width: auto; padding: 0 8px; gap: 6px; grid-auto-flow: column; font: 500 12px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .bar.moving { cursor: grabbing; }
  .bar .btn, .bar input { cursor: pointer; }
  .zoom { display: inline-flex; align-items: center; height: var(--oni-control); border-radius: 8px; background: var(--oni-bg-subtle); padding: 0 2px; }
  .zoom .btn { width: var(--oni-control-sm); height: var(--oni-control-sm); }
  .zoom output { min-width: 44px; text-align: center; font: 500 13px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; font-variant-numeric: tabular-nums; }
  .group { display: flex; gap: 1px; }
  .bar.sub .btn { width: 30px; height: 30px; }
  .bar .sep { margin: 0 2px; }
  .width-menu, .zoom-menu { position: relative; cursor: default; }
  .width-menu summary, .zoom-menu summary { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; list-style: none; cursor: pointer; padding: 8px; border-radius: 6px; background: var(--oni-bg-subtle); }
  .width-menu summary::-webkit-details-marker, .zoom-menu summary::-webkit-details-marker { display: none; }
  .width-options { position: absolute; top: calc(100% + 6px); right: 0; z-index: 5; width: 150px; padding: 10px; box-shadow: var(--shadow); background: var(--oni-bg-surface); border: 1px solid var(--oni-border-default); border-radius: 8px; }
  .width-options #pw { width: 126px; }
  #palette .btn[aria-pressed="true"], #ringPalette .btn[aria-pressed="true"] { outline: 1px solid var(--oni-action-default); outline-offset: -1px; }
  #palette .btn, #ringPalette .btn { width: 26px; height: 28px; }
  #palette i, #ringPalette i { width: 14px; height: 14px; border-radius: 50%; background: var(--swatch); }
  .pointer-size-menu { position: relative; font-size: 12px; }
  .pointer-size-menu summary { cursor: pointer; list-style: none; padding: 4px 6px; border-radius: 6px; background: var(--oni-bg-subtle); white-space: nowrap; }
  .pointer-size-options { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; background: var(--oni-bg-surface); padding: 8px; border: 1px solid var(--oni-border-default); border-radius: 8px; box-shadow: var(--shadow); }
  #pointerSize { width: 100px; accent-color: var(--oni-focus); }
  .pointer-opacity { align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
  #pointerOpacity { width: 64px; accent-color: var(--oni-focus); }
  #pointerOpacityValue { min-width: 32px; }
  .pointer-only { display: none; }
  .pointer-mode .sub > :not(#palette):not(.pointer-only) { display: none; }
  .pointer-mode .sub > .pointer-only { display: flex; }
  .pointer-mode .sub { justify-content: flex-start !important; gap: 8px; }
  .brand { cursor: grab; touch-action: none; }

  .zoom > .btn { width: 34px; height: 32px; }
  .zoom > .btn svg { width: 24px; height: 24px; color: var(--oni-text-primary); }
  .zoom-menu summary { font-size: 12px; white-space: nowrap; }
  .zoom-menu summary { display: grid; place-items: center; padding: 5px; width: 30px; height: 30px; }
  .zoom-menu summary svg { width: 18px; height: 18px; fill: none; stroke: var(--oni-text-primary); stroke-width: 1.7; stroke-linecap: round; }
  .zoom-options { position: absolute; left: 0; top: calc(100% + 6px); z-index: 6; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--oni-bg-surface); border: 1px solid var(--oni-border-default); border-radius: 8px; box-shadow: var(--shadow); }
  #zoomRange { width: 112px; accent-color: #2383E2; }
  #zoomValue { min-width: 38px; font-size: 12px; }


  .tip {
    position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); white-space: nowrap;
    background: var(--oni-text-primary); color: #fff; font-size: 12px; line-height: 18px; padding: 3px 8px;
    border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 2;
  }
  .btn:hover .tip { opacity: 1; }
  kbd { font: 500 11px/1 "Noto Sans KR", sans-serif; background: rgba(255, 255, 255, .18); border-radius: 4px; padding: 2px 4px; margin-left: 6px; }

  /* 접힌 현재 도구를 누르면 툴바를 펼친다. */
  #restore { display: none; touch-action: none; cursor: grab; }
  #restore:active { cursor: grabbing; }
  .bar.folded { border-radius: 999px; padding: 4px; }
  .bar.folded > :not(#restore) { display: none; }
  .bar.folded #restore { display: grid; }
  .bar.folded .btn { border-radius: 50%; width: var(--oni-control-sm); height: var(--oni-control-sm); }
  .bar.folded .brand { margin: 0 2px 0 4px; }
  #fold svg { transition: transform .12s; }
  .zoom-ribbon { display: none; }
  .zoom-mode:not(.folded) #sub { display: none; }
  .zoom-mode:not(.folded) .zoom-ribbon { display: flex; align-items: center; gap: 8px; }
  .zoom-ribbon .hint { font-size: 12px; color: var(--oni-text-secondary); white-space: nowrap; }
  .zoom-ribbon #zoomRange { flex: 1; min-width: 80px; }
  .eraser-ribbon { display: none; }
  .eraser-mode:not(.folded) #sub, .eraser-mode:not(.folded) .zoom-ribbon { display: none; }
  .eraser-mode:not(.folded) .eraser-ribbon { display: flex; align-items: center; gap: 8px; }
</style>
<link rel="stylesheet" href="toolbar-glass.css">
</head>
<body>
<div class="stack" id="stack">
<div class="bar" id="bar">
  <button class="btn" id="restore" aria-label="툴바 펼치기"></button>
  <img class="brand keep" src="assets/oni-screen.svg" width="22" height="22" alt="OniScreen" title="메뉴바 이동">

  <div class="zoom" role="group" aria-label="확대">
    <button class="btn" id="zoomFixed" aria-label="화면 확대" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15.5 15.5 5 5M7 10h6M10 7v6"/></svg><span class="tip">화면 확대 · Ctrl 1</span></button>

  </div>

  <div class="sep"></div>

  <div class="group" id="tools" role="group" aria-label="도구">
    <button class="btn" data-tool="pen" aria-pressed="false" aria-label="펜"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/></svg><span class="tip">펜<kbd>Ctrl 2</kbd></span></button>
    <button class="btn" data-tool="hl" aria-pressed="false" aria-label="형광펜"><svg viewBox="0 0 24 24"><path d="m8 13 9-9 4 4-9 9H8zM8 13l4 4M8 17l-3 3H3l5-5"/><path d="M3 21h9"/></svg><span class="tip">형광펜<kbd>Ctrl 3</kbd></span></button>
    <button class="btn" data-tool="eraser" aria-pressed="false" aria-label="지우개"><svg viewBox="0 0 24 24"><path d="m4 13 9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-9 9H8l-4-4a2 2 0 0 1 0-3zM10 7l8 8M8 20h13"/></svg><span class="tip">지우개<kbd>Ctrl 4</kbd></span></button>
    <button class="btn" data-tool="text" aria-pressed="false" aria-label="텍스트"><svg viewBox="0 0 24 24"><path d="M5 6V4.5h14V6M12 4.5V19.5M9 19.5h6"/></svg><span class="tip">텍스트<kbd>Ctrl 5</kbd></span></button>
  </div>

  <button class="btn keep" id="ptrBtn" aria-pressed="true" aria-label="포인터 강조" style="margin-left:2px">
    <svg viewBox="0 0 24 24"><path d="m6 4 12 7-5.2 1.6L10.5 18z"/><path d="M19 4.5l1.2-1.2M20.5 8h1.5M16 3V1.5"/></svg>
    <span class="tip">포인터 강조<kbd>Ctrl 6</kbd></span>
  </button>

  <div class="sep"></div>

  <button class="btn" id="undo" aria-label="실행 취소"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 8h-3"/></svg><span class="tip">실행 취소<kbd>Ctrl Z</kbd></span></button>
  <button class="btn" id="gear" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="tip">설정</span></button>

  <div class="sep"></div>
  <button class="btn keep" id="fold" aria-label="접기"><svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></svg><span class="tip">툴바 접기</span></button>
  <button class="btn keep danger" id="quit" aria-label="종료"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M7 6.5a8 8 0 1 0 10 0"/></svg><span class="tip">종료<kbd>Ctrl Alt Q</kbd></span></button>
</div>

<div class="bar eraser-ribbon" role="toolbar" aria-label="지우개 옵션">
  <span class="lbl">지우개</span>
  <button class="btn wide" id="eraseSelected" aria-label="선택 지우기" aria-pressed="true">선택 지우기<span class="tip">선택 지우기<kbd>Ctrl 4</kbd></span></button>
  <button class="btn wide danger" id="clear" aria-label="모두 지우기">모두 지우기<span class="tip">모두 지우기<kbd>Ctrl Shift 4</kbd></span></button>
</div>
<div class="bar zoom-ribbon" role="toolbar" aria-label="화면 확대 옵션">
  <span class="lbl">화면 확대</span>
  <button class="btn" id="zoomOut" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg><span class="tip">축소<kbd>Ctrl ↓</kbd></span></button>
  <input id="zoomRange" type="range" min="1" max="8" step="0.25" aria-label="확대 배율"><output id="zoomValue" for="zoomRange">2×</output>
  <button class="btn" id="zoomIn" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg><span class="tip">확대<kbd>Ctrl ↑</kbd></span></button>
  <span class="hint">Space 누름 · 라이브 줌</span>
  <button class="btn wide" id="zoomExit" aria-label="확대 종료">종료<span class="tip">확대 종료<kbd>Esc</kbd></span></button>
</div>
<div class="bar sub" id="sub" role="toolbar" aria-label="그리기 옵션">
  <span class="lbl">도형</span>
  <div class="group" id="shapes" role="group" aria-label="도형">
    <button class="btn" data-shape="line" aria-pressed="false" aria-label="선"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg><span class="tip">선<kbd>Shift+드래그</kbd></span></button>
    <button class="btn" data-shape="rect" aria-pressed="false" aria-label="사각형"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg><span class="tip">사각형<kbd>Ctrl+드래그</kbd></span></button>
    <button class="btn" data-shape="ellipse" aria-pressed="false" aria-label="타원"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><span class="tip">타원<kbd>Tab+드래그</kbd></span></button>
    <button class="btn" data-shape="arrow" aria-pressed="false" aria-label="화살표"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9"/></svg><span class="tip">화살표<kbd>Ctrl+Shift+드래그</kbd></span></button>
  </div>
  <button class="btn" id="hlShape" aria-pressed="false" aria-label="형광 도형"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" style="fill:currentColor;fill-opacity:.25"/></svg><span class="tip">도형을 형광으로 채우기</span></button>
  <div class="sep"></div>
  <span class="lbl pointer-only">포인터</span>
  <div class="group" id="palette" role="group" aria-label="기본 색상">
    <button class="btn" data-color="#292927" aria-label="검정" aria-pressed="true"><i style="--swatch:#292927"></i></button>
    <button class="btn" data-color="#2383E2" aria-label="블루" aria-pressed="false"><i style="--swatch:#2383E2"></i></button>
    <button class="btn" data-color="#C43F35" aria-label="레드" aria-pressed="false"><i style="--swatch:#C43F35"></i></button>
  </div>
  <span class="lbl pointer-only">클릭 링</span>
  <div class="group pointer-only" id="ringPalette" role="group" aria-label="클릭 링 색상">
    <button class="btn" data-color="35,131,226" aria-label="블루"><i style="--swatch:rgb(35,131,226)"></i></button>
    <button class="btn" data-color="235,166,64" aria-label="앰버"><i style="--swatch:rgb(235,166,64)"></i></button>
    <button class="btn" data-color="239,120,108" aria-label="코랄"><i style="--swatch:rgb(239,120,108)"></i></button>
  </div>
  <label class="pointer-only pointer-opacity" for="pointerOpacity">투명도<input id="pointerOpacity" type="range" min="10" max="100" step="5"><output id="pointerOpacityValue" for="pointerOpacity">100%</output></label>
  <details class="pointer-only pointer-size-menu"><summary aria-label="포인터 크기">크기 <output id="pointerSizeValue">44px</output> ▾</summary><div class="pointer-size-options"><input id="pointerSize" type="range" min="28" max="80" step="1" aria-label="포인터 크기"></div></details>
  <details class="width-menu"><summary aria-label="펜 굵기"><output class="pwv" id="pwv">4px</output> ▾</summary>
    <div class="width-options"><input type="range" id="pw" min="2" max="40" step="1" value="4" aria-label="펜 굵기"></div>
  </details>
  <div class="sep"></div>
  <div class="group" role="group" aria-label="바탕">
    <button class="btn" id="boardW" aria-pressed="false" aria-label="화이트보드"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="12" rx="1.5"/><path d="M9 20h6"/></svg><span class="tip">화이트보드<kbd>Ctrl 0</kbd></span></button>
    <button class="btn" id="boardK" aria-pressed="false" aria-label="칠판"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="12" rx="1.5" style="fill:currentColor"/><path d="M9 20h6"/></svg><span class="tip">칠판<kbd>Ctrl 0</kbd></span></button>
  </div>
  <div class="sep"></div>
  <button class="btn" id="shotCopy" aria-label="스크린샷 복사"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h1"/></svg><span class="tip">화면 복사<kbd>Ctrl Alt C</kbd></span></button>
</div>
</div>
<script src="shared.js"></script>
<script src="toolbar.js"></script>
</body>
</html>
