<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OniScreen Overlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
  #ink { position: absolute; left: 0; top: 0; touch-action: none; }

  /* 포인터 후광: 바깥 #halo는 위치(translate)만, 안쪽 i가 모양/크기 변화를 맡는다(둘을 섞으면 클릭 때 튀는 현상 발생) */
  #halo {
    --hc: 35,131,226; --s: 44px; --ho: 1;
    position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none;
    opacity: 0; transition: opacity .1s;
  }
  #halo.on { opacity: 1; }
  #halo i {
    position: absolute; left: calc(var(--s) / -2); top: calc(var(--s) / -2); width: var(--s); height: var(--s);
    border-radius: 50%; box-sizing: border-box; transform-origin: 50% 50%;
    background: rgba(var(--hc), var(--ho)); /* 투명도 100% = 원색, 테두리 없음 */
    transition: background .12s, transform .12s;
  }
  #halo.down i { transform: scale(.75); }

  /* 텍스트 입력 상자 */
  #tbox {
    position: relative; display: none; min-width: 2ch; max-width: 80vw; padding: 0; margin: 0;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-weight: 500; line-height: 1.25;
    white-space: pre; outline: 1.5px dashed rgba(35, 131, 226, .8); outline-offset: 3px;
    background: transparent; user-select: text; -webkit-user-select: text; caret-color: currentColor;
  }

  #textEditor { position: absolute; z-index: 3; }
  #textActions { position: absolute; left: 0; bottom: calc(100% + 8px); display: flex; gap: 4px; align-items: center; padding: 3px; border-radius: 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); white-space: nowrap; }
  #textEditor.actions-below #textActions { top: calc(100% + 8px); bottom: auto; }
  #textActions button, #textResize { color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; font: 12px/22px "Malgun Gothic", sans-serif; }
  #textActions output { font: 12px/22px "Malgun Gothic", sans-serif; padding: 0 4px; }
  #textResize { position: absolute; right: -12px; bottom: -12px; width: 24px; height: 24px; padding: 0; cursor: nwse-resize; touch-action: none; border-color: var(--focus); }
  #textActions { cursor: move; touch-action: none; padding-right: 14px; }
  #textMove { display: inline-flex; align-items: center; gap: 5px; width: auto; height: 28px; padding: 3px 8px; cursor: move !important; touch-action: none; }
  #textMove svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #textSizeMenu { position: relative; }
  #textSizeMenu summary { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; cursor: pointer; list-style: none; }
  #textSizeMenu summary::-webkit-details-marker { display: none; }
  .text-size-options { position: absolute; left: calc(100% + 8px); top: 0; padding: 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); z-index: 5; }
  #textFontSize { width: 108px; accent-color: var(--focus); }
  #textDelete { position: absolute; right: -13px; top: -13px; z-index: 4; display: grid; place-items: center; width: 22px; height: 22px; padding: 3px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--text); cursor: pointer; }
  #textDelete svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  #textDelete:hover { color: #C43F35; }

  /* 토스트·펜 굵기 표시: 툴바와 같은 Oni 토큰(표면·테두리·그림자·12px 모서리) */
  :root { --surface: rgba(248,250,255,.8); --border: rgba(90,110,140,.22); --text: #182332; --focus: #2383E2; }
  #textActions, .text-size-options { border-radius: 12px; backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); box-shadow: 0 3px 8px rgba(20,35,60,.14), inset 0 1px 0 rgba(255,255,255,.5); }
  #toast {
    position: absolute; left: 50%; top: 28px; transform: translate(-50%, -8px); max-width: 70vw;
    padding: 8px 14px; border-radius: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(41,41,39,.06), 0 6px 20px rgba(41,41,39,.10);
    font: 500 13px/20px "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #penhud { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .15s; }
  #penhud.on { opacity: 1; }
  #penhud i {
    --d: 4px; position: absolute; left: calc(var(--d) / -2); top: calc(var(--d) / -2); width: var(--d); height: var(--d);
    border-radius: 50%; border: 1.5px solid var(--focus); background: rgba(35,131,226,.15); box-sizing: content-box;
  }
  @media (prefers-color-scheme: dark) { :root { --surface: rgba(35,43,55,.84); --border: rgba(210,225,245,.25); --text: #F3F3F1; } }

  .ripple {
    position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; box-sizing: border-box;
    border: 2.5px solid rgb(var(--rc)); pointer-events: none; animation: rip .45s ease-out forwards;
  }
  .ripple.calm { animation: flash .3s ease-out forwards; }
  @keyframes rip { from { transform: scale(1); opacity: .85; } to { transform: scale(3); opacity: 0; } }
  @keyframes flash { from { opacity: .8; } to { opacity: 0; } }
</style>
</head>
<body>
<canvas id="ink"></canvas>
<div id="halo"><i></i></div>
<div id="penhud"><i></i></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="textEditor" hidden>
  <div id="textActions"><button id="textMove" aria-label="텍스트 드래그 이동" title="드래그로 텍스트 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><span>이동</span></button><details id="textSizeMenu"><summary aria-label="글자 크기 선택"><output id="textSizeLabel">28px</output><span aria-hidden="true">▾</span></summary><div class="text-size-options"><input id="textFontSize" type="range" min="14" max="144" step="1" value="28" aria-label="글자 크기"></div></details></div>
  <button id="textDelete" aria-label="입력 중인 텍스트 삭제" title="삭제"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
  <div id="tbox" contenteditable="plaintext-only" spellcheck="false" role="textbox" aria-label="텍스트 입력" aria-multiline="true"></div>
  <button id="textResize" aria-label="드래그 또는 방향키로 글자 크기 조절" title="드래그로 글자 크기 조절">↘</button>
</div>
<script src="shared.js"></script>
<script src="overlay.js"></script>
</body>
</html>
