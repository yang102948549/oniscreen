[package]
name = "screen-probe"
version = "0.2.0"
edition = "2021"
description = "Windows screen-sharing and magnified-input feasibility probe"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Magnification", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security"] }
