name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Check toolbar and overlay regressions
        run: |
          node scripts/check-settings.cjs
          node scripts/check-overlay.cjs
      - run: cargo test --locked
      - run: npx tauri build -- --locked
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item target/release/OniScreen.exe out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: OniScreen-windows
          path: out/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OniScreen ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
